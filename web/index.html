<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HamiKisan</title>
  <base href="$FLUTTER_BASE_HREF">
  <meta name="description" content="HamiKisan - Agriculture Platform for Nepal">
</head>
<body>
  <script>
    // Handle SPA redirect from 404.html (GitHub Pages SPA routing)
    // The 404.html redirects /HamiKisan/some-route to /HamiKisan/?some-route
    // This script restores the path so Flutter router can handle it
    (function() {
      try {
        var search = window.location.search;
        if (search && search.startsWith('?')) {
          var path = search.substring(1);
          if (path && !path.startsWith('~and~')) {
            window.history.replaceState(null, '', '/' + path);
          }
        }
      } catch (e) {}
    })();
  </script>
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=' + serviceWorkerVersion);
      });
    }
    window.addEventListener('load', function (ev) {
      loadMainDartJs();
    });
  </script>
</body>
</html>
